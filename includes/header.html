            <div class="color-theme-switcher">
                <button class="color-theme-btn" id="colorThemeBtn" aria-label="Change color theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                    </svg>
                </button>
                <div class="color-theme-dropdown" id="colorThemeDropdown">
                    <button class="color-option" data-theme="blue">
                        <span class="color-preview" style="background: linear-gradient(135deg, #2563eb, #1d4ed8);"></span>
                        <span>Blue</span>
                    </button>
                    <button class="color-option" data-theme="purple">
                        <span class="color-preview" style="background: linear-gradient(135deg, #7c3aed, #6d28d9);"></span>
                        <span>Purple</span>
                    </button>
                    <button class="color-option" data-theme="green">
                        <span class="color-preview" style="background: linear-gradient(135deg, #10b981, #059669);"></span>
                        <span>Green</span>
                    </button>
                    <button class="color-option" data-theme="orange">
                        <span class="color-preview" style="background: linear-gradient(135deg, #f59e0b, #d97706);"></span>
                        <span>Orange</span>
                    </button>
                    <button class="color-option" data-theme="red">
                        <span class="color-preview" style="background: linear-gradient(135deg, #ef4444, #dc2626);"></span>
                        <span>Red</span>
                    </button>
                    <button class="color-option" data-theme="teal">
                        <span class="color-preview" style="background: linear-gradient(135deg, #14b8a6, #0d9488);"></span>
                        <span>Teal</span>
                    </button>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg class="theme-icon-svg sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="theme-icon-svg moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
